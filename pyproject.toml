[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "polars-dta"
dynamic = ["version"]
description = "Write Polars DataFrames to Stata .dta files"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Leo Liu", email = "auleo.liu@gmail.com" }]
keywords = ["polars", "stata", "dta", "dataframe"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.10"
dependencies = ["polars>=1.3"]

[project.urls]
Repository = "https://github.com/leoliu0/polars_dta"
Issues = "https://github.com/leoliu0/polars_dta/issues"

[dependency-groups]
dev = ["maturin>=1.15,<2", "numpy", "pandas", "pytest", "ruff"]

[tool.maturin]
python-source = "python"
module-name = "polars_dta._polars_dta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["python"]