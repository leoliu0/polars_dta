name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - uses: astral-sh/setup-uv@v7
      - run: uvx ruff check
      - run: uvx ruff format --check

  # Platforms Polars publishes wheels for; each wheel is abi3 (CPython 3.10+).
  wheels:
    name: wheel ${{ matrix.runner }} ${{ matrix.target }} ${{ matrix.manylinux }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, target: x86_64, manylinux: auto }
          - { runner: ubuntu-24.04-arm, target: aarch64, manylinux: auto }
          - { runner: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { runner: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
          - { runner: macos-15-intel, target: x86_64 }
          - { runner: macos-latest, target: aarch64 }
          - { runner: windows-latest, target: x64, python-arch: x64 }
          - { runner: windows-11-arm, target: aarch64, python-arch: arm64 }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: ${{ matrix.python-arch }}
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: wheel-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: dist
      - name: Test the wheel
        if: matrix.manylinux != 'musllinux_1_2'
        shell: bash
        run: |
          set -e
          python -m venv .venv-test
          if [ "$RUNNER_OS" = Windows ]; then py=.venv-test/Scripts/python; else py=.venv-test/bin/python; fi
          $py -m pip install --no-index --no-deps --find-links dist polars-dta
          $py -m pip install polars numpy pandas pytest
          $py -m pytest -q
      - name: Test the wheel on Alpine
        if: matrix.manylinux == 'musllinux_1_2'
        run: |
          docker run --rm -v "$PWD":/io -w /io alpine:latest sh -ec '
            apk add --no-cache python3
            python3 -m venv /venv
            /venv/bin/pip install --no-index --no-deps --find-links dist polars-dta
            /venv/bin/pip install polars numpy pandas pytest
            /venv/bin/python -m pytest -q
          '

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist

  # Trusted publishing: PyPI accepts uploads from this workflow and environment, no token needed.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/polars-dta
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
