[package]
name = "polars_dta"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Write Polars DataFrames to Stata .dta files"
license = "MIT"
publish = false

[lib]
name = "_polars_dta"
crate-type = ["cdylib"]

[dependencies]
arrow-arith = "60.1"
arrow-array = { version = "60.1", features = ["ffi"] }
arrow-buffer = "60.1"
arrow-schema = "60.1"
pyo3 = { version = "0.30", features = ["abi3-py310", "extension-module"] }
tempfile = "3.27"

[profile.release]
lto = "thin"
codegen-units = 1
